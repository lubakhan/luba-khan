<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator_box">
      <div class="edit">
          <div class="calculator_content_ box"> 
            <h2> Simple Calculator</h2>
            <hr>
            <input type="number" name="num1" id="num1"style="margin: 10px;">
            <input type="number" name="num2" id="num2"><br><br>
            <div class="button list">
                <button class="op button" onclick="additionfun()">+</button>
                <button class="op button" onclick="subtractfun()">-</button>
                <button class="op button" onclick="multiplyfun()">*</button>
                <button class="op button" onclick="dividefun()">/</button>
                <button class="op button" onclick="modulusfun()">%</button>
            </div><br>
            <p class="center">
                <h2><span class="resulttext">Result</span><br><br></h2>
                <span id="result"></span>
            </p>

  // if (num >= 10000000000 && num < 100000000000) call = 9;

        </div>
      </div>
    <script src="script.js"></script>
</body>
</html>
